<div class="container">
    <section id="admin-section">
        <h2>Admin Panel - Manage Products</h2>

        <table class="table table-hover">
            <thead>
                <tr class="table-secondary">
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Price (€)</th>
                    <th>Stock Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <tr>
                    <td>1</td>
                    <td>Goalkeeper Gloves</td>
                    <td>49.99</td>
                    <td>25</td>
                    <td>
                        <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Goalkeeper Jersey</td>
                    <td>39.99</td>
                    <td>15</td>
                    <td>
                        <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="mt-4">
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">Add New Product</button>
        </div>
    </section>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Edit Product</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-product-form">
                        <div class="mb-3">
                            <label for="edit-name" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="edit-name" placeholder="Enter product name">
                        </div>
                        <div class="mb-3">
                            <label for="edit-price" class="form-label">Price (€)</label>
                            <input type="number" step="0.01" class="form-control" id="edit-price" placeholder="Enter price">
                        </div>
                        <div class="mb-3">
                            <label for="edit-quantity" class="form-label">Stock Quantity</label>
                            <input type="number" class="form-control" id="edit-quantity" placeholder="Enter stock quantity">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary">Save Changes</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Add New Product</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-product-form">
                        <div class="mb-3">
                            <label for="add-name" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="add-name" placeholder="Enter product name">
                        </div>
                        <div class="mb-3">
                            <label for="add-price" class="form-label">Price (€)</label>
                            <input type="number" step="0.01" class="form-control" id="add-price" placeholder="Enter price">
                        </div>
                        <div class="mb-3">
                            <label for="add-quantity" class="form-label">Stock Quantity</label>
                            <input type="number" class="form-control" id="add-quantity" placeholder="Enter stock quantity">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success">Add Product</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
